services:
  db:
    image: postgres:15-alpine
    container_name: earthquakecheck-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d earthquake_check"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - earthquakecheck-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: earthquakecheck-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - earthquakecheck-net

  frontend:
    build:
      context: ../../earthquake-check-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://api.mehmeterenozden.com
    container_name: earthquakecheck-frontend
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "3000:80"
    networks:
      - earthquakecheck-net

volumes:
  postgres_data:

networks:
  earthquakecheck-net:
    driver: bridge
