# /etc/nginx/sites-available/earthquakecheck
# Symlink: sudo ln -s /etc/nginx/sites-available/earthquakecheck /etc/nginx/sites-enabled/
# Test & reload: sudo nginx -t && sudo systemctl reload nginx

# FRONTEND YONLENDIRMESI
server {
    listen 80;
    server_name earthquakecheck.mehmeterenozden.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# BACKEND API YONLENDIRMESI
server {
    listen 80;
    server_name api.mehmeterenozden.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
