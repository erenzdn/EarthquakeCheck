# nginx-gateway: /var/opt/docker/ngnix_proxy/conf.d/earthquakecheck.conf
# Ayni domain uzerinde frontend + /api/ backend yonlendirmesi

server {
    listen 80;
    server_name earthquakecheck.mehmeterenozden.com;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://earthquakecheck-app:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    location / {
        proxy_pass http://earthquakecheck-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
