spring.application.name=EarthquakeCheck
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=earthquakecheck
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=earthquakecheck
spring.flyway.schemas=earthquakecheck

geocoding.nominatim.base-url=${GEOCODING_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
geocoding.nominatim.user-agent=${GEOCODING_NOMINATIM_USER_AGENT:EarthquakeCheck/1.0 (contact: local-dev)}
geocoding.nominatim.max-results=${GEOCODING_NOMINATIM_MAX_RESULTS:5}
geocoding.nominatim.min-match-score=${GEOCODING_NOMINATIM_MIN_MATCH_SCORE:0.45}

ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.strict.capacity=${RATE_LIMIT_STRICT_CAPACITY:10}
ratelimit.strict.refill=${RATE_LIMIT_STRICT_REFILL:10}
ratelimit.strict.period=${RATE_LIMIT_STRICT_PERIOD:1m}
ratelimit.relaxed.capacity=${RATE_LIMIT_RELAXED_CAPACITY:60}
ratelimit.relaxed.refill=${RATE_LIMIT_RELAXED_REFILL:60}
ratelimit.relaxed.period=${RATE_LIMIT_RELAXED_PERIOD:1m}
ratelimit.contact.capacity=${RATE_LIMIT_CONTACT_CAPACITY:5}
ratelimit.contact.refill=${RATE_LIMIT_CONTACT_REFILL:5}
ratelimit.contact.period=${RATE_LIMIT_CONTACT_PERIOD:1h}
ratelimit.exempt-paths=${RATE_LIMIT_EXEMPT_PATHS:/actuator/health,/actuator/**,/swagger-ui/**,/v3/api-docs/**}
ratelimit.relaxed-paths=${RATE_LIMIT_RELAXED_PATHS:/api/**}
ratelimit.strict-paths=${RATE_LIMIT_STRICT_PATHS:POST:/api/building/evaluate}
ratelimit.contact-paths=${RATE_LIMIT_CONTACT_PATHS:POST:/api/contact/messages}
ratelimit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
ratelimit.ip-header=${RATE_LIMIT_IP_HEADER:X-Forwarded-For}
ratelimit.cache-expiration=${RATE_LIMIT_CACHE_EXPIRATION:15m}
ratelimit.cache-max-size=${RATE_LIMIT_CACHE_MAX_SIZE:100000}

app.security.admin-token=${APP_ADMIN_TOKEN:change-this-admin-token}
